name: Offline checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: bash -n install.sh scripts/cr100-bridge
      - run: shellcheck install.sh scripts/cr100-bridge
      - run: python tools/distribution.py --copy /tmp/cr100-release
      - run: python -m unittest discover -s /tmp/cr100-release/tools -p 'test_*.py' -q
      - run: python /tmp/cr100-release/tools/test_link.py
